name: Deploy Infrastructure - ARM Templates

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/infra-arm/**'
      - 'src/infra-bicep/**'
      - '.github/workflows/deploy-infra.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/infra-arm/**'
      - 'src/infra-bicep/**'
  workflow_dispatch:
    inputs:
      environmentName:
        description: 'Environment name (dev, nonprod, prod)'
        required: true
        default: 'dev'
      location:
        description: 'Azure region'
        required: true
        default: 'centralus'
      confirm:
        description: 'Type "yes" to confirm deployment'
        required: true
        default: 'no'
      deployType:
        description: 'Deployment type (arm or bicep)'
        required: true
        default: 'arm'
        type: choice
        options:
          - arm
          - bicep

env:
  ARM_TEMPLATE: src/infra-arm/main.json
  BICEP_TEMPLATE: src/infra-bicep/main.bicep
  PARAMS_FILE: src/infra-arm/azuredeploy.parameters.json

jobs:
  validate-policies:
    name: Validate APIM Policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Validate APIM policies
        run: |
          chmod +x scripts/validate-apim-policies.sh
          ./scripts/validate-apim-policies.sh src/infra-bicep/modules/apim-policy.xml

      - name: Validate ARM template policies inline
        run: |
          echo "Checking ARM template for policy errors..."
          if grep -q "jwt-validate" src/infra-arm/main.json; then
            echo "::error::Found 'jwt-validate' in ARM template - should be 'validate-jwt'"
            exit 1
          fi
          echo "Policy validation passed"

  validate-templates:
    name: Validate Templates
    runs-on: ubuntu-latest
    needs: [validate-policies]
    outputs:
      rg_name: ${{ steps.env.outputs.rg_name }}
      env_name: ${{ steps.env.outputs.env_name }}
      deploy_type: ${{ steps.env.outputs.deploy_type }}
    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            NAME="${{ github.event.inputs.environmentName }}"
            DEPLOY_TYPE="${{ github.event.inputs.deployType }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            NAME="prod"
            DEPLOY_TYPE="arm"
          else
            NAME="dev"
            DEPLOY_TYPE="arm"
          fi
          echo "env_name=$NAME" >> $GITHUB_OUTPUT
          echo "rg_name=az-rapidgo-${NAME}-rg" >> $GITHUB_OUTPUT
          echo "deploy_type=$DEPLOY_TYPE" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Bicep CLI
        if: steps.env.outputs.deploy_type == 'bicep'
        run: |
          az bicep install
          az bicep version

      - name: Check and delete existing RG if location mismatch
        run: |
          RG_NAME="${{ steps.env.outputs.rg_name }}"
          TARGET_LOCATION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'centralus' }}"

          if az group exists --name "$RG_NAME" | grep -q "true"; then
            EXISTING_LOCATION=$(az group show --name "$RG_NAME" --query location -o tsv)
            if [ "$EXISTING_LOCATION" != "$TARGET_LOCATION" ]; then
              echo "Resource Group exists in '$EXISTING_LOCATION' but target is '$TARGET_LOCATION'"
              echo "Deleting existing Resource Group..."
              az group delete --name "$RG_NAME" --yes --no-wait

              for i in {1..30}; do
                if ! az group exists --name "$RG_NAME" | grep -q "true"; then
                  echo "Resource Group deleted successfully"
                  break
                fi
                echo "Waiting... ($i/30)"
                sleep 10
              done
            else
              echo "Resource Group exists in correct location: $EXISTING_LOCATION"
            fi
          fi

      - name: Register required resource providers
        run: |
          PROVIDERS=(
            "Microsoft.DocumentDB"
            "Microsoft.Storage"
            "Microsoft.Web"
            "Microsoft.ApiManagement"
            "Microsoft.NotificationHubs"
            "Microsoft.KeyVault"
            "Microsoft.Insights"
            "Microsoft.OperationalInsights"
          )

          for PROVIDER in "${PROVIDERS[@]}"; do
            STATUS=$(az provider show --namespace "$PROVIDER" --query "registrationState" -o tsv 2>/dev/null || echo "NotRegistered")
            if [ "$STATUS" != "Registered" ]; then
              echo "Registering $PROVIDER..."
              az provider register --namespace "$PROVIDER"
            else
              echo "$PROVIDER already registered"
            fi
          done

      - name: Purge soft-deleted resources
        run: |
          LOCATION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'centralus' }}"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Purging soft-deleted resources..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Purge soft-deleted APIM services
          echo "Checking for soft-deleted APIM services..."
          DELETED_APIM=$(az apim deletedservice list --query "[?location=='$LOCATION' && starts_with(serviceName, 'az-rapidgo')].serviceName" -o tsv 2>/dev/null || echo "")

          if [ -n "$DELETED_APIM" ]; then
            echo "Found soft-deleted APIM services:"
            echo "$DELETED_APIM"
            for APIM in $DELETED_APIM; do
              echo "Purging APIM: $APIM"
              az apim deletedservice purge --service-name "$APIM" --location "$LOCATION" 2>/dev/null || echo "Failed to purge $APIM (may not exist)"
            done
            echo "✅ APIM purge complete"
          else
            echo "✅ No APIM services to purge"
          fi

          # Purge soft-deleted Key Vaults
          echo ""
          echo "Checking for soft-deleted Key Vaults..."
          DELETED_KV=$(az keyvault list-deleted --query "[?properties.location=='$LOCATION' && starts_with(name, 'az-rapidgo')].name" -o tsv 2>/dev/null || echo "")

          if [ -n "$DELETED_KV" ]; then
            echo "Found soft-deleted Key Vaults:"
            echo "$DELETED_KV"
            for KV in $DELETED_KV; do
              echo "Purging Key Vault: $KV"
              az keyvault purge --name "$KV" --location "$LOCATION" 2>/dev/null || echo "Failed to purge $KV (may not exist)"
            done
            echo "✅ Key Vault purge complete"
          else
            echo "✅ No Key Vaults to purge"
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Soft-delete purge complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Create Resource Group
        run: |
          az group create \
            --name ${{ steps.env.outputs.rg_name }} \
            --location ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'centralus' }} \
            --tags environment=${{ steps.env.outputs.env_name }} managedBy=github-actions

      - name: Validate ARM Template
        if: steps.env.outputs.deploy_type == 'arm'
        run: |
          az deployment group validate \
            --resource-group ${{ steps.env.outputs.rg_name }} \
            --name "validate-rapidgo-${{ steps.env.outputs.env_name }}-$(date +%Y%m%d%H%M%S)" \
            --template-file $ARM_TEMPLATE \
            --parameters @$PARAMS_FILE \
            --parameters environmentName=${{ steps.env.outputs.env_name }}

      - name: Validate Bicep Template
        if: steps.env.outputs.deploy_type == 'bicep'
        run: |
          az deployment sub validate \
            --name "validate-rapidgo-${{ steps.env.outputs.env_name }}-$(date +%Y%m%d%H%M%S)" \
            --location ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'centralus' }} \
            --template-file $BICEP_TEMPLATE \
            --parameters environmentName=${{ steps.env.outputs.env_name }}

      - name: What-If Analysis (ARM)
        if: steps.env.outputs.deploy_type == 'arm' && github.event_name == 'pull_request'
        run: |
          az deployment group what-if \
            --resource-group ${{ steps.env.outputs.rg_name }} \
            --name "whatif-rapidgo-${{ steps.env.outputs.env_name }}" \
            --template-file $ARM_TEMPLATE \
            --parameters @$PARAMS_FILE \
            --parameters environmentName=${{ steps.env.outputs.env_name }} \
            --result-format FullResourcePayloads

      - name: What-If Analysis (Bicep)
        if: steps.env.outputs.deploy_type == 'bicep' && github.event_name == 'pull_request'
        run: |
          az deployment sub what-if \
            --name "whatif-rapidgo-${{ steps.env.outputs.env_name }}" \
            --location ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'centralus' }} \
            --template-file $BICEP_TEMPLATE \
            --parameters environmentName=${{ steps.env.outputs.env_name }} \
            --result-format FullResourcePayloads

  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [validate-templates]
    if: >
      github.event_name != 'pull_request' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'yes'))

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Bicep CLI
        if: needs.validate-templates.outputs.deploy_type == 'bicep'
        run: az bicep install

      - name: Capture pre-deployment state
        id: pre-deploy
        run: |
          RG="${{ needs.validate-templates.outputs.rg_name }}"

          # Guardar lista de recursos existentes antes del deployment
          if az group exists --name "$RG" | grep -q "true"; then
            EXISTING_RESOURCES=$(az resource list --resource-group "$RG" --query "[].id" -o tsv | sort)
            echo "$EXISTING_RESOURCES" > /tmp/pre-deploy-resources.txt
            echo "has_existing_resources=true" >> $GITHUB_OUTPUT
            echo "Pre-deployment resources captured:"
            cat /tmp/pre-deploy-resources.txt
          else
            touch /tmp/pre-deploy-resources.txt
            echo "has_existing_resources=false" >> $GITHUB_OUTPUT
            echo "Resource group is new, no existing resources"
          fi

      - name: Deploy ARM Template (First Attempt)
        if: needs.validate-templates.outputs.deploy_type == 'arm'
        id: deploy
        timeout-minutes: 45
        continue-on-error: true
        run: |
          az deployment group create \
            --resource-group ${{ needs.validate-templates.outputs.rg_name }} \
            --name arm-rapidgo-${{ needs.validate-templates.outputs.env_name }} \
            --template-file $ARM_TEMPLATE \
            --parameters @$PARAMS_FILE \
            --parameters environmentName=${{ needs.validate-templates.outputs.env_name }} \
            --mode Incremental \
            --query properties.outputs

      - name: Cleanup and Retry on Soft-Delete Error
        if: needs.validate-templates.outputs.deploy_type == 'arm' && steps.deploy.outcome == 'failure'
        id: cleanup-retry
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚠️ First deployment failed - attempting cleanup"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          LOCATION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'centralus' }}"
          RG="${{ needs.validate-templates.outputs.rg_name }}"

          # Check for soft-deleted APIM
          echo "Purging soft-deleted APIM services..."
          DELETED_APIM=$(az apim deletedservice list --query "[?starts_with(serviceName, 'az-rapidgo')].{name:serviceName, location:location}" -o json 2>/dev/null || echo "[]")

          if [ "$DELETED_APIM" != "[]" ]; then
            echo "$DELETED_APIM" | jq -r '.[] | "\(.name)|\(.location)"' | while IFS='|' read -r NAME LOC; do
              echo "Purging APIM: $NAME in $LOC"
              az apim deletedservice purge --service-name "$NAME" --location "$LOC" 2>/dev/null || echo "Failed to purge $NAME"
            done
          fi

          # Check for soft-deleted Key Vaults
          echo "Purging soft-deleted Key Vaults..."
          DELETED_KV=$(az keyvault list-deleted --query "[?starts_with(name, 'az-rapidgo')].{name:name, location:properties.location}" -o json 2>/dev/null || echo "[]")

          if [ "$DELETED_KV" != "[]" ]; then
            echo "$DELETED_KV" | jq -r '.[] | "\(.name)|\(.location)"' | while IFS='|' read -r NAME LOC; do
              echo "Purging Key Vault: $NAME in $LOC"
              az keyvault purge --name "$NAME" --location "$LOC" 2>/dev/null || echo "Failed to purge $NAME"
            done
          fi

          # Delete and recreate resource group if location conflict
          if az group exists --name "$RG" | grep -q "true"; then
            echo "Checking for location conflicts..."
            EXISTING_LOCATION=$(az group show --name "$RG" --query location -o tsv)
            if [ "$EXISTING_LOCATION" != "$LOCATION" ]; then
              echo "Location mismatch detected: $EXISTING_LOCATION vs $LOCATION"
              echo "Deleting and recreating resource group..."
              az group delete --name "$RG" --yes --no-wait

              # Wait for deletion
              for i in {1..60}; do
                if ! az group exists --name "$RG" | grep -q "true"; then
                  echo "Resource group deleted"
                  break
                fi
                echo "Waiting for deletion... ($i/60)"
                sleep 5
              done

              # Recreate resource group
              az group create --name "$RG" --location "$LOCATION" --tags environment=${{ needs.validate-templates.outputs.env_name }} managedBy=github-actions
            fi
          fi

          echo "⏱️ Waiting 60 seconds for purge operations to complete..."
          sleep 60

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔄 Retrying deployment..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          az deployment group create \
            --resource-group "$RG" \
            --name arm-rapidgo-${{ needs.validate-templates.outputs.env_name }}-retry \
            --template-file $ARM_TEMPLATE \
            --parameters @$PARAMS_FILE \
            --parameters environmentName=${{ needs.validate-templates.outputs.env_name }} \
            --mode Incremental \
            --query properties.outputs

      - name: Check Deployment Status
        if: needs.validate-templates.outputs.deploy_type == 'arm'
        run: |
          if [ "${{ steps.deploy.outcome }}" == "success" ]; then
            echo "✅ Deployment succeeded on first attempt"
          elif [ "${{ steps.cleanup-retry.outcome }}" == "success" ]; then
            echo "✅ Deployment succeeded after cleanup and retry"
          else
            echo "❌ Deployment failed"
            exit 1
          fi

      - name: Deploy Bicep Template (First Attempt)
        if: needs.validate-templates.outputs.deploy_type == 'bicep'
        id: deploy-bicep
        timeout-minutes: 45
        continue-on-error: true
        run: |
          az deployment sub create \
            --name bicep-rapidgo-${{ needs.validate-templates.outputs.env_name }} \
            --location ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'centralus' }} \
            --template-file $BICEP_TEMPLATE \
            --parameters environmentName=${{ needs.validate-templates.outputs.env_name }}

      - name: Cleanup and Retry Bicep on Soft-Delete Error
        if: needs.validate-templates.outputs.deploy_type == 'bicep' && steps.deploy-bicep.outcome == 'failure'
        id: cleanup-retry-bicep
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚠️ Bicep deployment failed - attempting cleanup"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          LOCATION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'centralus' }}"

          # Purge soft-deleted resources
          echo "Purging soft-deleted APIM services..."
          DELETED_APIM=$(az apim deletedservice list --query "[?starts_with(serviceName, 'az-rapidgo')].{name:serviceName, location:location}" -o json 2>/dev/null || echo "[]")
          if [ "$DELETED_APIM" != "[]" ]; then
            echo "$DELETED_APIM" | jq -r '.[] | "\(.name)|\(.location)"' | while IFS='|' read -r NAME LOC; do
              az apim deletedservice purge --service-name "$NAME" --location "$LOC" 2>/dev/null || echo "Failed to purge $NAME"
            done
          fi

          echo "Purging soft-deleted Key Vaults..."
          DELETED_KV=$(az keyvault list-deleted --query "[?starts_with(name, 'az-rapidgo')].{name:name, location:properties.location}" -o json 2>/dev/null || echo "[]")
          if [ "$DELETED_KV" != "[]" ]; then
            echo "$DELETED_KV" | jq -r '.[] | "\(.name)|\(.location)"' | while IFS='|' read -r NAME LOC; do
              az keyvault purge --name "$NAME" --location "$LOC" 2>/dev/null || echo "Failed to purge $NAME"
            done
          fi

          echo "⏱️ Waiting 60 seconds for purge operations to complete..."
          sleep 60

          echo "🔄 Retrying Bicep deployment..."
          az deployment sub create \
            --name bicep-rapidgo-${{ needs.validate-templates.outputs.env_name }}-retry \
            --location "$LOCATION" \
            --template-file $BICEP_TEMPLATE \
            --parameters environmentName=${{ needs.validate-templates.outputs.env_name }}

      - name: Check Bicep Deployment Status
        if: needs.validate-templates.outputs.deploy_type == 'bicep'
        run: |
          if [ "${{ steps.deploy-bicep.outcome }}" == "success" ]; then
            echo "✅ Bicep deployment succeeded on first attempt"
          elif [ "${{ steps.cleanup-retry-bicep.outcome }}" == "success" ]; then
            echo "✅ Bicep deployment succeeded after cleanup and retry"
          else
            echo "❌ Bicep deployment failed"
            exit 1
          fi

      - name: Rollback on deployment failure
        if: failure() && ((steps.deploy.outcome == 'failure' && steps.cleanup-retry.outcome == 'failure') || (steps.deploy-bicep.outcome == 'failure' && steps.cleanup-retry-bicep.outcome == 'failure'))
        run: |
          RG="${{ needs.validate-templates.outputs.rg_name }}"
          ENV="${{ needs.validate-templates.outputs.env_name }}"

          echo "## 🔴 Deployment Failed - Iniciando Rollback Automático" | tee -a $GITHUB_STEP_SUMMARY
          echo "" | tee -a $GITHUB_STEP_SUMMARY

          # Obtener recursos actuales
          CURRENT_RESOURCES=$(az resource list --resource-group "$RG" --query "[].id" -o tsv 2>/dev/null | sort || echo "")

          # Comparar con recursos pre-deployment
          if [ -f /tmp/pre-deploy-resources.txt ]; then
            PRE_DEPLOY_RESOURCES=$(cat /tmp/pre-deploy-resources.txt)

            # Encontrar recursos nuevos (creados en este deployment)
            NEW_RESOURCES=$(comm -13 <(echo "$PRE_DEPLOY_RESOURCES") <(echo "$CURRENT_RESOURCES"))

            if [ -n "$NEW_RESOURCES" ]; then
              echo "### Recursos creados en este deployment (serán eliminados):" | tee -a $GITHUB_STEP_SUMMARY
              echo '```' | tee -a $GITHUB_STEP_SUMMARY
              echo "$NEW_RESOURCES" | while read -r resource_id; do
                RESOURCE_NAME=$(basename "$resource_id")
                echo "- $RESOURCE_NAME" | tee -a $GITHUB_STEP_SUMMARY
              done
              echo '```' | tee -a $GITHUB_STEP_SUMMARY
              echo "" | tee -a $GITHUB_STEP_SUMMARY

              # Eliminar recursos nuevos uno por uno (en orden inverso de dependencias)
              echo "Eliminando recursos nuevos..."
              echo "$NEW_RESOURCES" | tac | while read -r resource_id; do
                if [ -n "$resource_id" ]; then
                  RESOURCE_NAME=$(basename "$resource_id")
                  echo "Eliminando: $RESOURCE_NAME"
                  az resource delete --ids "$resource_id" --verbose || echo "Failed to delete $RESOURCE_NAME"
                fi
              done

              echo "✓ Rollback completado - recursos nuevos eliminados" | tee -a $GITHUB_STEP_SUMMARY
            else
              echo "No se crearon recursos nuevos en este deployment" | tee -a $GITHUB_STEP_SUMMARY
            fi
          else
            # Si no hay archivo pre-deploy, eliminar todo el resource group si es nuevo
            if [ "${{ steps.pre-deploy.outputs.has_existing_resources }}" == "false" ]; then
              echo "Resource group fue creado en este deployment - eliminando completamente" | tee -a $GITHUB_STEP_SUMMARY
              az group delete --name "$RG" --yes --no-wait
              echo "✓ Resource group $RG eliminado" | tee -a $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ No se puede determinar recursos nuevos - rollback manual requerido" | tee -a $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" | tee -a $GITHUB_STEP_SUMMARY
          echo "### Error Details" | tee -a $GITHUB_STEP_SUMMARY
          echo "Revisa los logs del step 'Deploy ARM Template' o 'Deploy Bicep Template' para más detalles" | tee -a $GITHUB_STEP_SUMMARY

          exit 1

      - name: Configure FCM v1 on Notification Hub
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            SA_JSON='${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
            CLIENT_EMAIL=$(echo "$SA_JSON" | jq -r '.client_email')
            PRIVATE_KEY=$(echo "$SA_JSON" | jq -r '.private_key')
            PROJECT_ID=$(echo "$SA_JSON" | jq -r '.project_id')

            SUBSCRIPTION_ID=$(az account show --query id -o tsv)
            RG="${{ needs.validate-templates.outputs.rg_name }}"
            NS="az-rapidgo-${{ needs.validate-templates.outputs.env_name }}-notif-ns"
            HUB="az-rapidgo-${{ needs.validate-templates.outputs.env_name }}-notifications"

            az rest --method put \
              --url "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG}/providers/Microsoft.NotificationHubs/namespaces/${NS}/notificationHubs/${HUB}/pnsCredentials?api-version=2023-01-01-preview" \
              --headers "Content-Type=application/json" \
              --body "{
                \"properties\": {
                  \"fcmV1Credential\": {
                    \"properties\": {
                      \"clientEmail\": \"${CLIENT_EMAIL}\",
                      \"privateKey\": \"${PRIVATE_KEY}\",
                      \"projectId\": \"${PROJECT_ID}\"
                    }
                  }
                }
              }" && { echo "FCM v1 configured"; break; } || {
              echo "Attempt $i failed, retrying..." >&2
              sleep 5
            }
          done

      - name: Deployment Summary
        if: success()
        run: |
          {
            echo "## Infrastructure Deployed"
            echo "- Environment: **${{ needs.validate-templates.outputs.env_name }}**"
            echo "- Resource Group: **${{ needs.validate-templates.outputs.rg_name }}**"
            echo "- Deploy Type: **${{ needs.validate-templates.outputs.deploy_type }}**"
          } >> $GITHUB_STEP_SUMMARY

      - name: Azure Logout
        if: always()
        run: az logout
