name: Deploy Infrastructure - ARM Templates

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/infra-arm/**'
  workflow_dispatch:
    inputs:
      environmentName:
        description: 'Environment name (dev, nonprod, prod)'
        required: true
        default: 'dev'
      location:
        description: 'Azure region'
        required: true
        default: 'brazilsouth'
      confirm:
        description: 'Type "yes" to confirm deployment'
        required: true
        default: 'no'

env:
  ARM_DEPLOYMENT_NAME: rapidgo-arm-deploy

jobs:
  validate:
    name: Validate ARM Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set environment name
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.environmentName }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "name=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "name=dev" >> $GITHUB_OUTPUT
          else
            echo "name=dev" >> $GITHUB_OUTPUT
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Resource Group exists
        run: |
          RG="az-rapidgo-${{ steps.env.outputs.name }}-rg"
          LOCATION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'brazilsouth' }}"
          if [ "$(az group exists --name "$RG" --output tsv)" == "false" ]; then
            az group create --name "$RG" --location "$LOCATION" \
              --tags Environment=${{ steps.env.outputs.name }} ManagedBy=github-actions
            echo "Resource Group $RG creado"
          else
            echo "Resource Group $RG ya existe"
          fi

      - name: Validate main.json
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: az-rapidgo-${{ steps.env.outputs.name }}-rg
          template: src/infra-arm/main.json
          parameters: src/infra-arm/azuredeploy.parameters.json
          deploymentMode: Validate

  deploy:
    name: Deploy Infrastructure to Azure
    runs-on: ubuntu-latest
    needs: [validate]
    if: >
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'yes')

    steps:
      - uses: actions/checkout@v4

      - name: Set environment name
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.environmentName }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "name=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "name=dev" >> $GITHUB_OUTPUT
          else
            echo "name=dev" >> $GITHUB_OUTPUT
          fi

      - name: Mark RG as created by this run
        id: rg
        run: |
          RG="az-rapidgo-${{ steps.env.outputs.name }}-rg"
          if [ "$(az group exists --name "$RG" --output tsv)" == "true" ]; then
            echo "was_created=false" >> $GITHUB_OUTPUT
          else
            echo "was_created=true" >> $GITHUB_OUTPUT
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group
        run: |
          az group create \
            --name az-rapidgo-${{ steps.env.outputs.name }}-rg \
            --location ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'brazilsouth' }} \
            --tags Environment=${{ steps.env.outputs.name }} ManagedBy=github-actions

      - name: Deploy ARM Template
        id: deploy
        uses: azure/arm-deploy@v2
        timeout-minutes: 30
        with:
          resourceGroupName: az-rapidgo-${{ steps.env.outputs.name }}-rg
          template: src/infra-arm/main.json
          deploymentName: ${{ env.ARM_DEPLOYMENT_NAME }}-${{ steps.env.outputs.name }}
          parameters: >
            environmentName=${{ steps.env.outputs.name }}
            location=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'brazilsouth' }}
            functionAppRuntime=node
            cosmosDBFreeTier=true
            skuAPIM=Developer
          deploymentMode: Incremental

      - name: Configure FCM v1 on Notification Hub
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            SA_JSON='${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
            CLIENT_EMAIL=$(echo "$SA_JSON" | jq -r '.client_email')
            PRIVATE_KEY=$(echo "$SA_JSON" | jq -r '.private_key')
            PROJECT_ID=$(echo "$SA_JSON" | jq -r '.project_id')

            SUBSCRIPTION_ID=$(az account show --query id -o tsv)
            RG="az-rapidgo-${{ steps.env.outputs.name }}-rg"
            NS="az-rapidgo-${{ steps.env.outputs.name }}-notif-ns"
            HUB="az-rapidgo-${{ steps.env.outputs.name }}-notifications"

            az rest --method put \
              --url "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG}/providers/Microsoft.NotificationHubs/namespaces/${NS}/notificationHubs/${HUB}/pnsCredentials?api-version=2023-01-01-preview" \
              --headers "Content-Type=application/json" \
              --body "{
                \"properties\": {
                  \"fcmV1Credential\": {
                    \"properties\": {
                      \"clientEmail\": \"${CLIENT_EMAIL}\",
                      \"privateKey\": \"${PRIVATE_KEY}\",
                      \"projectId\": \"${PROJECT_ID}\"
                    }
                  }
                }
              }" && { echo "FCM v1 configurado correctamente"; break; } || {
              echo "Intento $i fallo, reintentando..." >&2
              sleep 5
            }
          done

      - name: Rollback on failure
        if: failure()
        run: |
          RG="az-rapidgo-${{ steps.env.outputs.name }}-rg"
          echo "## Fallo en el despliegue de infraestructura" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Causas posibles" >> $GITHUB_STEP_SUMMARY
          echo "- Cuota de suscucion insuficiente (Cosmos DB free tier ya usado en otra suscripcion)" >> $GITHUB_STEP_SUMMARY
          echo "- Nombre de recurso duplicado (Key Vault, Storage Account son globales)" >> $GITHUB_STEP_SUMMARY
          echo "- Error de permisos del Service Principal" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Limpieza manual (si es necesario)" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "az group delete --name $RG --yes --no-wait" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> El deployment ARM usa modo Incremental: los recursos creados antes del fallo" >> $GITHUB_STEP_SUMMARY
          echo "> fueron revertidos automaticamente por Azure. Si el RG se creo en este mismo" >> $GITHUB_STEP_SUMMARY
          echo "> workflow, el comando anterior lo eliminara por completo." >> $GITHUB_STEP_SUMMARY

      - name: Deployment Summary
        if: success()
        run: |
          {
            echo "## Infraestructura Desplegada"
            echo "- Entorno: **${{ steps.env.outputs.name }}**"
            echo "- Grupo de recursos: **az-rapidgo-${{ steps.env.outputs.name }}-rg**"
            echo "- Function App: \`${{ steps.deploy.outputs.functionAppDefaultHostName }}\`"
            echo "- API Management: \`${{ steps.deploy.outputs.apimGatewayUrl }}\`"
            echo "- Cosmos DB: \`${{ steps.deploy.outputs.cosmosDbEndpoint }}\`"
            echo "- Blob Storage: \`${{ steps.deploy.outputs.blobStorageEndpoint }}\`"
            echo "- Notification Hubs: \`${{ steps.deploy.outputs.notificationHubEndpoint }}\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: Azure Logout
        if: always()
        run: az logout
