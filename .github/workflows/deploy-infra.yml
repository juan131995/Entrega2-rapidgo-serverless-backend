name: Deploy Infrastructure - ARM Templates

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/infra-arm/**'
      - 'src/infra-bicep/**'
      - '.github/workflows/deploy-infra.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/infra-arm/**'
      - 'src/infra-bicep/**'
  workflow_dispatch:
    inputs:
      environmentName:
        description: 'Environment name (dev, nonprod, prod)'
        required: true
        default: 'dev'
      location:
        description: 'Azure region'
        required: true
        default: 'centralus'
      confirm:
        description: 'Type "yes" to confirm deployment'
        required: true
        default: 'no'
      deployType:
        description: 'Deployment type (arm or bicep)'
        required: true
        default: 'arm'
        type: choice
        options:
          - arm
          - bicep

env:
  ARM_TEMPLATE: src/infra-arm/main.json
  BICEP_TEMPLATE: src/infra-bicep/main.bicep
  PARAMS_FILE: src/infra-arm/azuredeploy.parameters.json

jobs:
  validate-policies:
    name: Validate APIM Policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Validate APIM policies
        run: |
          chmod +x scripts/validate-apim-policies.sh
          ./scripts/validate-apim-policies.sh src/infra-bicep/modules/apim-policy.xml

      - name: Validate ARM template policies inline
        run: |
          echo "Checking ARM template for policy errors..."
          if grep -q "jwt-validate" src/infra-arm/main.json; then
            echo "::error::Found 'jwt-validate' in ARM template - should be 'validate-jwt'"
            exit 1
          fi
          echo "Policy validation passed"

  validate-templates:
    name: Validate Templates
    runs-on: ubuntu-latest
    needs: [validate-policies]
    outputs:
      rg_name: ${{ steps.env.outputs.rg_name }}
      env_name: ${{ steps.env.outputs.env_name }}
      deploy_type: ${{ steps.env.outputs.deploy_type }}
      random_suffix: ${{ steps.random-suffix.outputs.suffix }}
    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            NAME="${{ github.event.inputs.environmentName }}"
            DEPLOY_TYPE="${{ github.event.inputs.deployType }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            NAME="prod"
            DEPLOY_TYPE="arm"
          else
            NAME="dev"
            DEPLOY_TYPE="arm"
          fi
          echo "env_name=$NAME" >> $GITHUB_OUTPUT
          echo "rg_name=az-rapidgo-${NAME}-rg" >> $GITHUB_OUTPUT
          echo "deploy_type=$DEPLOY_TYPE" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Bicep CLI
        if: steps.env.outputs.deploy_type == 'bicep'
        run: |
          az bicep install
          az bicep version

      - name: Check and delete existing RG to ensure clean deployment
        run: |
          RG_NAME="${{ steps.env.outputs.rg_name }}"
          TARGET_LOCATION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'centralus' }}"

          if az group exists --name "$RG_NAME" | grep -q "true"; then
            echo "Resource Group '$RG_NAME' already exists"
            echo "Deleting to ensure clean deployment with new random suffix..."
            
            # List existing resources for logging
            echo "Existing resources:"
            az resource list --resource-group "$RG_NAME" --query "[].{name:name, type:type}" -o table || true
            
            # Delete the resource group
            echo "Deleting resource group..."
            az group delete --name "$RG_NAME" --yes --no-wait

            # Wait for complete deletion (up to 30 minutes)
            echo "Waiting for resource group deletion..."
            MAX_WAIT=360
            for i in $(seq 1 $MAX_WAIT); do
              if ! az group exists --name "$RG_NAME" | grep -q "true"; then
                echo "✅ Resource Group deleted successfully after $((i * 5 / 60)) minutes"
                break
              fi
              if [ $((i % 12)) -eq 0 ]; then
                echo "Still deleting... ($i/$MAX_WAIT) - $((i * 5 / 60)) minutes elapsed"
              fi
              sleep 5
            done

            # Verify deletion
            if az group exists --name "$RG_NAME" | grep -q "true"; then
              echo "❌ ERROR: Resource group still exists after 30 minutes"
              echo "Remaining resources:"
              az resource list --resource-group "$RG_NAME" --query "[].{name:name, type:type}" -o table || true
              exit 1
            fi
          else
            echo "Resource Group '$RG_NAME' does not exist - will be created fresh"
          fi

      - name: Register required resource providers
        run: |
          PROVIDERS=(
            "Microsoft.DocumentDB"
            "Microsoft.Storage"
            "Microsoft.Web"
            "Microsoft.ApiManagement"
            "Microsoft.NotificationHubs"
            "Microsoft.KeyVault"
            "Microsoft.Insights"
            "Microsoft.OperationalInsights"
          )

          for PROVIDER in "${PROVIDERS[@]}"; do
            STATUS=$(az provider show --namespace "$PROVIDER" --query "registrationState" -o tsv 2>/dev/null || echo "NotRegistered")
            if [ "$STATUS" != "Registered" ]; then
              echo "Registering $PROVIDER..."
              az provider register --namespace "$PROVIDER"
            else
              echo "$PROVIDER already registered"
            fi
          done

      - name: Purge soft-deleted resources (Preventive)
        run: |
          LOCATION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'centralus' }}"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "PRE-DEPLOYMENT: Purging soft-deleted resources"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Purge ALL soft-deleted APIM services (any location)
          echo "Checking for soft-deleted APIM services (all locations)..."
          DELETED_APIM=$(az apim deletedservice list --query "[?starts_with(serviceName, 'az-rapidgo')].{name:serviceName, location:location}" -o json 2>/dev/null || echo "[]")

          if [ "$DELETED_APIM" != "[]" ]; then
            echo "Found soft-deleted APIM services:"
            echo "$DELETED_APIM" | jq -r '.[] | "  - \(.name) in \(.location)"'

            echo "$DELETED_APIM" | jq -r '.[] | "\(.name)|\(.location)"' | while IFS='|' read -r NAME LOC; do
              echo "Purging APIM: $NAME in $LOC"
              az apim deletedservice purge --service-name "$NAME" --location "$LOC" 2>&1 || echo "⚠️ Failed to purge $NAME"
            done

            # Wait for APIM purge to complete
            echo "⏱️ Waiting 2 minutes for APIM purge to complete..."
            sleep 120

            # Verify purge completed
            STILL_EXISTS=$(az apim deletedservice list --query "[?starts_with(serviceName, 'az-rapidgo')].serviceName" -o tsv 2>/dev/null || echo "")
            if [ -n "$STILL_EXISTS" ]; then
              echo "⚠️ WARNING: Some APIM services still in soft-deleted state:"
              echo "$STILL_EXISTS"
              echo "Waiting another 2 minutes..."
              sleep 120
            else
              echo "✅ All APIM services purged successfully"
            fi
          else
            echo "✅ No APIM services to purge"
          fi

          # Purge ALL soft-deleted Key Vaults (any location)
          echo ""
          echo "Checking for soft-deleted Key Vaults (all locations)..."
          DELETED_KV=$(az keyvault list-deleted --query "[?starts_with(name, 'az-rapidgo')].{name:name, location:properties.location}" -o json 2>/dev/null || echo "[]")

          if [ "$DELETED_KV" != "[]" ]; then
            echo "Found soft-deleted Key Vaults:"
            echo "$DELETED_KV" | jq -r '.[] | "  - \(.name) in \(.location)"'

            echo "$DELETED_KV" | jq -r '.[] | "\(.name)|\(.location)"' | while IFS='|' read -r NAME LOC; do
              echo "Purging Key Vault: $NAME in $LOC"
              az keyvault purge --name "$NAME" --location "$LOC" 2>&1 || echo "⚠️ Failed to purge $NAME"
            done
            echo "✅ Key Vault purge initiated"
          else
            echo "✅ No Key Vaults to purge"
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Pre-deployment purge complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Generate random suffix for resource names
        id: random-suffix
        run: |
          # Generate a random 6-character alphanumeric suffix
          SUFFIX=$(openssl rand -hex 3 | tr '0-9' 'a-j' | cut -c1-6)
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT
          echo "Generated random suffix: $SUFFIX"

      - name: Create Resource Group
        run: |
          az group create \
            --name ${{ steps.env.outputs.rg_name }} \
            --location ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'centralus' }} \
            --tags environment=${{ steps.env.outputs.env_name }} managedBy=github-actions randomSuffix=${{ steps.random-suffix.outputs.suffix }}

      - name: Validate ARM Template
        if: steps.env.outputs.deploy_type == 'arm'
        run: |
          az deployment group validate \
            --resource-group ${{ steps.env.outputs.rg_name }} \
            --name "validate-rapidgo-${{ steps.env.outputs.env_name }}-$(date +%Y%m%d%H%M%S)" \
            --template-file $ARM_TEMPLATE \
            --parameters @$PARAMS_FILE \
            --parameters environmentName=${{ steps.env.outputs.env_name }} \
            --parameters randomSuffix=${{ steps.random-suffix.outputs.suffix }}

      - name: Validate Bicep Template
        if: steps.env.outputs.deploy_type == 'bicep'
        run: |
          az deployment sub validate \
            --name "validate-rapidgo-${{ steps.env.outputs.env_name }}-$(date +%Y%m%d%H%M%S)" \
            --location ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'centralus' }} \
            --template-file $BICEP_TEMPLATE \
            --parameters environmentName=${{ steps.env.outputs.env_name }} \
            --parameters randomSuffix=${{ steps.random-suffix.outputs.suffix }}

      - name: What-If Analysis (ARM)
        if: steps.env.outputs.deploy_type == 'arm' && github.event_name == 'pull_request'
        run: |
          az deployment group what-if \
            --resource-group ${{ steps.env.outputs.rg_name }} \
            --name "whatif-rapidgo-${{ steps.env.outputs.env_name }}" \
            --template-file $ARM_TEMPLATE \
            --parameters @$PARAMS_FILE \
            --parameters environmentName=${{ steps.env.outputs.env_name }} \
            --parameters randomSuffix=${{ steps.random-suffix.outputs.suffix }} \
            --result-format FullResourcePayloads

      - name: What-If Analysis (Bicep)
        if: steps.env.outputs.deploy_type == 'bicep' && github.event_name == 'pull_request'
        run: |
          az deployment sub what-if \
            --name "whatif-rapidgo-${{ steps.env.outputs.env_name }}" \
            --location ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'centralus' }} \
            --template-file $BICEP_TEMPLATE \
            --parameters environmentName=${{ steps.env.outputs.env_name }} \
            --parameters randomSuffix=${{ steps.random-suffix.outputs.suffix }} \
            --result-format FullResourcePayloads

  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [validate-templates]
    if: >
      github.event_name != 'pull_request' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'yes'))

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Bicep CLI
        if: needs.validate-templates.outputs.deploy_type == 'bicep'
        run: az bicep install

      - name: Clean up failed deployments
        if: needs.validate-templates.outputs.deploy_type == 'arm'
        run: |
          RG="${{ needs.validate-templates.outputs.rg_name }}"
          echo "Cleaning up failed deployments for resource group: $RG"
          
          # Get failed deployments and delete them
          FAILED_DEPLOYS=$(az deployment group list --resource-group "$RG" --query "[?properties.provisioningState=='Failed'].name" -o tsv 2>/dev/null || true)
          
          if [ -n "$FAILED_DEPLOYS" ]; then
            echo "Found failed deployments:"
            echo "$FAILED_DEPLOYS"
            
            for DEPLOY in $FAILED_DEPLOYS; do
              echo "Deleting failed deployment: $DEPLOY"
              az deployment group delete --resource-group "$RG" --name "$DEPLOY" 2>/dev/null || true
            done
            
            echo "✅ Failed deployments cleaned up"
          else
            echo "✅ No failed deployments to clean up"
          fi

      - name: Deploy ARM Template (First Attempt)
        if: needs.validate-templates.outputs.deploy_type == 'arm'
        id: deploy
        timeout-minutes: 45
        continue-on-error: true
        run: |
          # Use unique deployment name per run to avoid "Property at path location cannot be changed"
          DEPLOYMENT_NAME="arm-rapidgo-${{ needs.validate-templates.outputs.env_name }}-$(date +%Y%m%d%H%M%S)"
          echo "deployment_name=$DEPLOYMENT_NAME" >> $GITHUB_OUTPUT
          
          az deployment group create \
            --resource-group ${{ needs.validate-templates.outputs.rg_name }} \
            --name "$DEPLOYMENT_NAME" \
            --template-file $ARM_TEMPLATE \
            --parameters @$PARAMS_FILE \
            --parameters environmentName=${{ needs.validate-templates.outputs.env_name }} \
            --parameters randomSuffix=${{ needs.validate-templates.outputs.random_suffix }} \
            --mode Incremental \
            --query properties.outputs

      - name: Cleanup and Retry on Soft-Delete Error
        if: needs.validate-templates.outputs.deploy_type == 'arm' && steps.deploy.outcome == 'failure'
        id: cleanup-retry
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚠️ First deployment failed - FULL CLEANUP"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          LOCATION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'centralus' }}"
          RG="${{ needs.validate-templates.outputs.rg_name }}"

          # STEP 1: DELETE RESOURCE GROUP COMPLETELY
          echo ""
          echo "STEP 1: Deleting resource group completely..."
          echo "This will generate new unique names on recreation"

          if az group exists --name "$RG" | grep -q "true"; then
            echo "Deleting resource group: $RG"
            # Use synchronous delete with longer timeout for Cosmos DB
            echo "Starting synchronous deletion (timeout: 30 minutes)..."
            az group delete --name "$RG" --yes --no-wait

            # Wait for complete deletion (up to 30 minutes - Cosmos DB is slow)
            echo "Waiting for resource group deletion..."
            MAX_WAIT=360  # 30 minutes (360 * 5 seconds)
            for i in $(seq 1 $MAX_WAIT); do
              if ! az group exists --name "$RG" | grep -q "true"; then
                echo "✅ Resource group deleted successfully after $((i * 5 / 60)) minutes"
                break
              fi
              if [ $((i % 12)) -eq 0 ]; then
                echo "Still deleting... ($i/$MAX_WAIT) - $((i * 5 / 60)) minutes elapsed"
              fi
              sleep 5
            done

            # Verify deletion
            if az group exists --name "$RG" | grep -q "true"; then
              echo "❌ ERROR: Resource group still exists after 30 minutes"
              echo "Attempting force deletion of remaining resources..."
              
              # List remaining resources
              echo "Remaining resources:"
              az resource list --resource-group "$RG" --query "[].{name:name, type:type}" -o table || true
              
              exit 1
            fi
          else
            echo "Resource group doesn't exist, skipping deletion"
          fi

          # STEP 2: PURGE ALL SOFT-DELETED RESOURCES
          echo ""
          echo "STEP 2: Purging all soft-deleted resources..."

          # Purge Cosmos DB (soft-delete)
          echo "Purging soft-deleted Cosmos DB accounts..."
          DELETED_COSMOS=$(az cosmosdb list-deleted --query "[?starts_with(name, 'azrapidgo') || starts_with(name, 'az-rapidgo')].{name:name, location:location}" -o json 2>/dev/null || echo "[]")
          
          if [ "$DELETED_COSMOS" != "[]" ]; then
            echo "Found soft-deleted Cosmos DB accounts:"
            echo "$DELETED_COSMOS" | jq -r '.[] | "  - \(.name) in \(.location)"'
            
            echo "$DELETED_COSMOS" | jq -r '.[] | "\(.name)|\(.location)"' | while IFS='|' read -r NAME LOC; do
              echo "Purging Cosmos DB: $NAME in $LOC"
              az cosmosdb delete --name "$NAME" --resource-group "$RG" --yes 2>&1 || true
              az rest --method POST --url "https://management.azure.com/subscriptions/$(az account show --query id -o tsv)/providers/Microsoft.DocumentDB/locations/$LOC/onlineNaturalIncrease?api-version=2023-11-15" 2>&1 || true
            done
          else
            echo "✅ No soft-deleted Cosmos DB accounts found"
          fi

          # Purge APIM services
          echo "Purging soft-deleted APIM services..."
          DELETED_APIM=$(az apim deletedservice list --query "[?starts_with(serviceName, 'az-rapidgo')].{name:serviceName, location:location}" -o json 2>/dev/null || echo "[]")

          if [ "$DELETED_APIM" != "[]" ]; then
            echo "Found soft-deleted APIM services:"
            echo "$DELETED_APIM" | jq -r '.[] | "  - \(.name) in \(.location)"'

            echo "$DELETED_APIM" | jq -r '.[] | "\(.name)|\(.location)"' | while IFS='|' read -r NAME LOC; do
              echo "Purging APIM: $NAME in $LOC"
              az apim deletedservice purge --service-name "$NAME" --location "$LOC" 2>&1 || echo "⚠️ Failed to purge $NAME (may already be purging)"
            done
          else
            echo "✅ No soft-deleted APIM services found"
          fi

          # Purge Key Vaults
          echo ""
          echo "Purging soft-deleted Key Vaults..."
          DELETED_KV=$(az keyvault list-deleted --query "[?starts_with(name, 'az-rapidgo')].{name:name, location:properties.location}" -o json 2>/dev/null || echo "[]")

          if [ "$DELETED_KV" != "[]" ]; then
            echo "Found soft-deleted Key Vaults:"
            echo "$DELETED_KV" | jq -r '.[] | "  - \(.name) in \(.location)"'

            echo "$DELETED_KV" | jq -r '.[] | "\(.name)|\(.location)"' | while IFS='|' read -r NAME LOC; do
              echo "Purging Key Vault: $NAME in $LOC"
              az keyvault purge --name "$NAME" --location "$LOC" 2>&1 || echo "⚠️ Failed to purge $NAME (may already be purging)"
            done
          else
            echo "✅ No soft-deleted Key Vaults found"
          fi

          # STEP 3: WAIT FOR PURGE COMPLETION
          echo ""
          echo "STEP 3: Waiting for purge operations to complete..."
          echo "⏱️ Waiting 7 minutes for Cosmos DB, APIM and Key Vault purge to complete..."

          # Additional wait for Cosmos DB purge
          echo "Waiting 2 minutes for Cosmos DB purge..."
          sleep 120

          for i in {1..30}; do
            sleep 10
            if [ $((i % 6)) -eq 0 ]; then
              MINS=$((i / 6))
              echo "  ${MINS} minute(s) elapsed..."

              # Check if purge is complete
              STILL_DELETED_APIM=$(az apim deletedservice list --query "[?starts_with(serviceName, 'az-rapidgo')].serviceName" -o tsv 2>/dev/null || echo "")
              STILL_DELETED_KV=$(az keyvault list-deleted --query "[?starts_with(name, 'az-rapidgo')].name" -o tsv 2>/dev/null || echo "")
              STILL_DELETED_COSMOS=$(az cosmosdb list-deleted --query "[?starts_with(name, 'azrapidgo') || starts_with(name, 'az-rapidgo')].name" -o tsv 2>/dev/null || echo "")

              if [ -z "$STILL_DELETED_APIM" ] && [ -z "$STILL_DELETED_KV" ] && [ -z "$STILL_DELETED_COSMOS" ]; then
                echo "✅ All soft-deleted resources purged successfully!"
                break
              fi

              if [ -n "$STILL_DELETED_APIM" ]; then
                echo "  ⏳ Still purging APIM: $STILL_DELETED_APIM"
              fi
              if [ -n "$STILL_DELETED_KV" ]; then
                echo "  ⏳ Still purging Key Vault: $STILL_DELETED_KV"
              fi
              if [ -n "$STILL_DELETED_COSMOS" ]; then
                echo "  ⏳ Still purging Cosmos DB: $STILL_DELETED_COSMOS"
              fi
            fi
          done

          # STEP 4: RECREATE RESOURCE GROUP WITH NEW RANDOM SUFFIX
          echo ""
          echo "STEP 4: Recreating resource group with new random suffix..."
          
          # Generate new random suffix for recreation
          NEW_SUFFIX=$(openssl rand -hex 3 | tr '0-9' 'a-j' | cut -c1-6)
          echo "New random suffix: $NEW_SUFFIX"
          
          az group create \
            --name "$RG" \
            --location "$LOCATION" \
            --tags environment=${{ needs.validate-templates.outputs.env_name }} managedBy=github-actions randomSuffix=$NEW_SUFFIX

          echo "✅ Resource group recreated - new uniqueString will be generated"

          # STEP 5: RETRY DEPLOYMENT
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔄 RETRY: Deploying with fresh resource group"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          RETRY_DEPLOYMENT_NAME="arm-rapidgo-${{ needs.validate-templates.outputs.env_name }}-retry-$(date +%Y%m%d%H%M%S)"
          
          az deployment group create \
            --resource-group "$RG" \
            --name "$RETRY_DEPLOYMENT_NAME" \
            --template-file $ARM_TEMPLATE \
            --parameters @$PARAMS_FILE \
            --parameters environmentName=${{ needs.validate-templates.outputs.env_name }} \
            --parameters randomSuffix=$NEW_SUFFIX \
            --mode Incremental \
            --query properties.outputs

      - name: Check Deployment Status
        if: needs.validate-templates.outputs.deploy_type == 'arm'
        run: |
          if [ "${{ steps.deploy.outcome }}" == "success" ]; then
            echo "✅ Deployment succeeded on first attempt"
          elif [ "${{ steps.cleanup-retry.outcome }}" == "success" ]; then
            echo "✅ Deployment succeeded after cleanup and retry"
          else
            echo "❌ Deployment failed"
            exit 1
          fi

      - name: Deploy Bicep Template (First Attempt)
        if: needs.validate-templates.outputs.deploy_type == 'bicep'
        id: deploy-bicep
        timeout-minutes: 45
        continue-on-error: true
        run: |
          DEPLOYMENT_NAME="bicep-rapidgo-${{ needs.validate-templates.outputs.env_name }}-$(date +%Y%m%d%H%M%S)"
          echo "deployment_name=$DEPLOYMENT_NAME" >> $GITHUB_OUTPUT
          
          az deployment sub create \
            --name "$DEPLOYMENT_NAME" \
            --location ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'centralus' }} \
            --template-file $BICEP_TEMPLATE \
            --parameters environmentName=${{ needs.validate-templates.outputs.env_name }} \
            --parameters randomSuffix=${{ needs.validate-templates.outputs.random_suffix }}

      - name: Cleanup and Retry Bicep on Soft-Delete Error
        if: needs.validate-templates.outputs.deploy_type == 'bicep' && steps.deploy-bicep.outcome == 'failure'
        id: cleanup-retry-bicep
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚠️ Bicep deployment failed - FULL CLEANUP"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          LOCATION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'centralus' }}"
          RG="${{ needs.validate-templates.outputs.rg_name }}"

          # STEP 1: DELETE RESOURCE GROUP
          echo ""
          echo "STEP 1: Deleting resource group completely..."
          if az group exists --name "$RG" | grep -q "true"; then
            echo "Starting synchronous deletion (timeout: 30 minutes)..."
            az group delete --name "$RG" --yes --no-wait

            MAX_WAIT=360  # 30 minutes
            for i in $(seq 1 $MAX_WAIT); do
              if ! az group exists --name "$RG" | grep -q "true"; then
                echo "✅ Resource group deleted after $((i * 5 / 60)) minutes"
                break
              fi
              if [ $((i % 12)) -eq 0 ]; then
                echo "Deleting... ($((i * 5 / 60)) minutes)"
              fi
              sleep 5
            done
          fi

          # STEP 2: PURGE SOFT-DELETED RESOURCES
          echo ""
          echo "STEP 2: Purging soft-deleted resources..."

          # Purge Cosmos DB
          echo "Purging soft-deleted Cosmos DB accounts..."
          DELETED_COSMOS=$(az cosmosdb list-deleted --query "[?starts_with(name, 'azrapidgo') || starts_with(name, 'az-rapidgo')].name" -o tsv 2>/dev/null || echo "")
          if [ -n "$DELETED_COSMOS" ]; then
            echo "Found soft-deleted Cosmos DB: $DELETED_COSMOS"
          else
            echo "✅ No soft-deleted Cosmos DB accounts"
          fi

          DELETED_APIM=$(az apim deletedservice list --query "[?starts_with(serviceName, 'az-rapidgo')].{name:serviceName, location:location}" -o json 2>/dev/null || echo "[]")
          if [ "$DELETED_APIM" != "[]" ]; then
            echo "$DELETED_APIM" | jq -r '.[] | "\(.name)|\(.location)"' | while IFS='|' read -r NAME LOC; do
              echo "Purging APIM: $NAME"
              az apim deletedservice purge --service-name "$NAME" --location "$LOC" 2>&1
            done
          fi

          DELETED_KV=$(az keyvault list-deleted --query "[?starts_with(name, 'az-rapidgo')].{name:name, location:properties.location}" -o json 2>/dev/null || echo "[]")
          if [ "$DELETED_KV" != "[]" ]; then
            echo "$DELETED_KV" | jq -r '.[] | "\(.name)|\(.location)"' | while IFS='|' read -r NAME LOC; do
              echo "Purging Key Vault: $NAME"
              az keyvault purge --name "$NAME" --location "$LOC" 2>&1
            done
          fi

          # STEP 3: WAIT FOR PURGE
          echo ""
          echo "STEP 3: Waiting 7 minutes for purge completion..."
          # Additional wait for Cosmos DB
          echo "Waiting 2 minutes for Cosmos DB purge..."
          sleep 120
          
          for i in {1..30}; do
            sleep 10
            if [ $((i % 6)) -eq 0 ]; then
              echo "  $((i / 6)) minute(s) elapsed..."
            fi
          done

          # STEP 4: RECREATE RESOURCE GROUP WITH NEW RANDOM SUFFIX
          echo ""
          echo "STEP 4: Recreating resource group with new random suffix..."
          
          NEW_SUFFIX=$(openssl rand -hex 3 | tr '0-9' 'a-j' | cut -c1-6)
          echo "New random suffix: $NEW_SUFFIX"
          
          az group create --name "$RG" --location "$LOCATION" --tags environment=${{ needs.validate-templates.outputs.env_name }} managedBy=github-actions randomSuffix=$NEW_SUFFIX

          # STEP 5: RETRY
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔄 RETRY: Bicep deployment"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          RETRY_DEPLOYMENT_NAME="bicep-rapidgo-${{ needs.validate-templates.outputs.env_name }}-retry-$(date +%Y%m%d%H%M%S)"
          
          az deployment sub create \
            --name "$RETRY_DEPLOYMENT_NAME" \
            --location "$LOCATION" \
            --template-file $BICEP_TEMPLATE \
            --parameters environmentName=${{ needs.validate-templates.outputs.env_name }} \
            --parameters randomSuffix=$NEW_SUFFIX

      - name: Check Bicep Deployment Status
        if: needs.validate-templates.outputs.deploy_type == 'bicep'
        run: |
          if [ "${{ steps.deploy-bicep.outcome }}" == "success" ]; then
            echo "✅ Bicep deployment succeeded on first attempt"
          elif [ "${{ steps.cleanup-retry-bicep.outcome }}" == "success" ]; then
            echo "✅ Bicep deployment succeeded after cleanup and retry"
          else
            echo "❌ Bicep deployment failed"
            exit 1
          fi

      - name: Rollback on deployment failure
        if: failure() && ((steps.deploy.outcome == 'failure' && steps.cleanup-retry.outcome == 'failure') || (steps.deploy-bicep.outcome == 'failure' && steps.cleanup-retry-bicep.outcome == 'failure'))
        run: |
          RG="${{ needs.validate-templates.outputs.rg_name }}"
          ENV="${{ needs.validate-templates.outputs.env_name }}"

          echo "## 🔴 Deployment Failed - Iniciando Rollback Automático" | tee -a $GITHUB_STEP_SUMMARY
          echo "" | tee -a $GITHUB_STEP_SUMMARY

          # List resources created in this deployment
          if az group exists --name "$RG" | grep -q "true"; then
            echo "### Resources to be deleted:" | tee -a $GITHUB_STEP_SUMMARY
            echo '```' | tee -a $GITHUB_STEP_SUMMARY
            az resource list --resource-group "$RG" --query "[].name" -o tsv 2>/dev/null | while read -r name; do
              echo "- $name" | tee -a $GITHUB_STEP_SUMMARY
            done
            echo '```' | tee -a $GITHUB_STEP_SUMMARY
            echo "" | tee -a $GITHUB_STEP_SUMMARY

            # Delete entire resource group instead of individual resources
            echo "Deleting entire resource group for clean rollback..."
            az group delete --name "$RG" --yes --no-wait

            # Wait for deletion
            echo "Waiting for resource group deletion..."
            MAX_WAIT=360
            for i in $(seq 1 $MAX_WAIT); do
              if ! az group exists --name "$RG" | grep -q "true"; then
                echo "✅ Resource group deleted after $((i * 5 / 60)) minutes"
                break
              fi
              if [ $((i % 12)) -eq 0 ]; then
                echo "Still deleting... $((i * 5 / 60)) minutes elapsed"
              fi
              sleep 5
            done
          else
            echo "Resource group does not exist, nothing to rollback" | tee -a $GITHUB_STEP_SUMMARY
          fi

          echo "" | tee -a $GITHUB_STEP_SUMMARY
          echo "### Error Details" | tee -a $GITHUB_STEP_SUMMARY
          echo "Revisa los logs del step 'Deploy ARM Template' o 'Deploy Bicep Template' para más detalles" | tee -a $GITHUB_STEP_SUMMARY

          exit 1

      - name: Configure FCM v1 on Notification Hub
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            SA_JSON='${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
            CLIENT_EMAIL=$(echo "$SA_JSON" | jq -r '.client_email')
            PRIVATE_KEY=$(echo "$SA_JSON" | jq -r '.private_key')
            PROJECT_ID=$(echo "$SA_JSON" | jq -r '.project_id')

            SUBSCRIPTION_ID=$(az account show --query id -o tsv)
            RG="${{ needs.validate-templates.outputs.rg_name }}"
            NS="az-rapidgo-${{ needs.validate-templates.outputs.env_name }}-notif-ns"
            HUB="az-rapidgo-${{ needs.validate-templates.outputs.env_name }}-notifications"

            az rest --method put \
              --url "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG}/providers/Microsoft.NotificationHubs/namespaces/${NS}/notificationHubs/${HUB}/pnsCredentials?api-version=2023-01-01-preview" \
              --headers "Content-Type=application/json" \
              --body "{
                \"properties\": {
                  \"fcmV1Credential\": {
                    \"properties\": {
                      \"clientEmail\": \"${CLIENT_EMAIL}\",
                      \"privateKey\": \"${PRIVATE_KEY}\",
                      \"projectId\": \"${PROJECT_ID}\"
                    }
                  }
                }
              }" && { echo "FCM v1 configured"; break; } || {
              echo "Attempt $i failed, retrying..." >&2
              sleep 5
            }
          done

      - name: Deployment Summary
        if: success()
        run: |
          {
            echo "## Infrastructure Deployed"
            echo "- Environment: **${{ needs.validate-templates.outputs.env_name }}**"
            echo "- Resource Group: **${{ needs.validate-templates.outputs.rg_name }}**"
            echo "- Deploy Type: **${{ needs.validate-templates.outputs.deploy_type }}**"
          } >> $GITHUB_STEP_SUMMARY

      - name: Azure Logout
        if: always()
        run: az logout
