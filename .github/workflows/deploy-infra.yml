name: Deploy Infrastructure

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/infra-arm/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:
    inputs:
      environmentName:
        description: 'Environment (dev/prod)'
        required: true
        default: 'dev'
      location:
        description: 'Azure region'
        required: true
        default: 'centralus'

env:
  ARM_TEMPLATE: src/infra-arm/main.json
  PARAMS_FILE: src/infra-arm/azuredeploy.parameters.json

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set environment variables
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV_NAME="${{ github.event.inputs.environmentName }}"
            LOCATION="${{ github.event.inputs.location }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENV_NAME="prod"
            LOCATION="centralus"
          else
            ENV_NAME="dev"
            LOCATION="centralus"
          fi

          # Generate random suffix (6 chars)
          SUFFIX=$(openssl rand -hex 3)

          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "location=$LOCATION" >> $GITHUB_OUTPUT
          echo "rg_name=az-rapidgo-${ENV_NAME}-rg" >> $GITHUB_OUTPUT
          echo "random_suffix=$SUFFIX" >> $GITHUB_OUTPUT

          echo "Environment: $ENV_NAME"
          echo "Location: $LOCATION"
          echo "Random Suffix: $SUFFIX"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Delete existing Resource Group if exists
        run: |
          RG_NAME="${{ steps.env.outputs.rg_name }}"

          if az group exists --name "$RG_NAME" | grep -q "true"; then
            echo "⚠️ Resource Group '$RG_NAME' already exists. Deleting..."
            az group delete --name "$RG_NAME" --yes --no-wait

            # Wait for deletion (max 15 minutes)
            echo "Waiting for deletion to complete..."
            for i in {1..180}; do
              if ! az group exists --name "$RG_NAME" | grep -q "true"; then
                echo "✅ Resource Group deleted successfully"
                break
              fi
              if [ $((i % 12)) -eq 0 ]; then
                echo "Still deleting... $((i / 12)) minutes elapsed"
              fi
              sleep 5
            done

            # Verify deletion
            if az group exists --name "$RG_NAME" | grep -q "true"; then
              echo "❌ ERROR: Resource group still exists after 15 minutes"
              exit 1
            fi
          else
            echo "✅ Resource Group does not exist. Will create fresh."
          fi

      - name: Purge soft-deleted resources
        run: |
          echo "🗑️ Purging soft-deleted resources..."

          # Purge Key Vaults
          DELETED_KV=$(az keyvault list-deleted --query "[?starts_with(name, 'az-rapidgo-${{ steps.env.outputs.env_name }}')].name" -o tsv 2>/dev/null || echo "")
          if [ -n "$DELETED_KV" ]; then
            echo "Found soft-deleted Key Vaults: $DELETED_KV"
            for KV in $DELETED_KV; do
              echo "Purging Key Vault: $KV"
              az keyvault purge --name "$KV" --location ${{ steps.env.outputs.location }} 2>&1 || echo "⚠️ Could not purge $KV (may not exist)"
            done
            echo "⏱️ Waiting 30 seconds for Key Vault purge..."
            sleep 30
          else
            echo "✅ No Key Vaults to purge"
          fi

          # Purge APIM services
          DELETED_APIM=$(az apim deletedservice list --query "[?starts_with(serviceName, 'az-rapidgo-${{ steps.env.outputs.env_name }}')].serviceName" -o tsv 2>/dev/null || echo "")
          if [ -n "$DELETED_APIM" ]; then
            echo "Found soft-deleted APIM services: $DELETED_APIM"
            for APIM in $DELETED_APIM; do
              echo "Purging APIM: $APIM"
              az apim deletedservice purge --service-name "$APIM" --location ${{ steps.env.outputs.location }} 2>&1 || echo "⚠️ Could not purge $APIM (may not exist)"
            done
            echo "⏱️ Waiting 30 seconds for APIM purge..."
            sleep 30
          else
            echo "✅ No APIM services to purge"
          fi

          echo "✅ Purge complete"

      - name: Create Resource Group
        run: |
          az group create \
            --name ${{ steps.env.outputs.rg_name }} \
            --location ${{ steps.env.outputs.location }} \
            --tags environment=${{ steps.env.outputs.env_name }} managedBy=github-actions

      - name: Deploy ARM Template
        id: deploy
        timeout-minutes: 60
        run: |
          DEPLOYMENT_NAME="rapidgo-${{ steps.env.outputs.env_name }}-$(date +%Y%m%d-%H%M%S)"

          az deployment group create \
            --resource-group ${{ steps.env.outputs.rg_name }} \
            --name "$DEPLOYMENT_NAME" \
            --template-file $ARM_TEMPLATE \
            --parameters @$PARAMS_FILE \
            --parameters environmentName=${{ steps.env.outputs.env_name }} \
            --parameters randomSuffix=${{ steps.env.outputs.random_suffix }} \
            --mode Incremental \
            --verbose

      - name: Get Deployment Outputs
        if: success()
        run: |
          OUTPUTS=$(az deployment group show \
            --resource-group ${{ steps.env.outputs.rg_name }} \
            --name $(az deployment group list -g ${{ steps.env.outputs.rg_name }} --query "[0].name" -o tsv) \
            --query properties.outputs -o json)

          echo "Deployment Outputs:"
          echo "$OUTPUTS" | jq .

      - name: Deployment Summary
        if: success()
        run: |
          {
            echo "## ✅ Deployment Successful"
            echo ""
            echo "- **Environment:** ${{ steps.env.outputs.env_name }}"
            echo "- **Resource Group:** ${{ steps.env.outputs.rg_name }}"
            echo "- **Location:** ${{ steps.env.outputs.location }}"
            echo "- **Random Suffix:** ${{ steps.env.outputs.random_suffix }}"
            echo ""
            echo "### Next Steps"
            echo "1. Verify resources in Azure Portal"
            echo "2. Deploy function code"
            echo "3. Test API endpoints"
          } >> $GITHUB_STEP_SUMMARY

      - name: Cleanup on Failure
        if: failure()
        run: |
          echo "⚠️ Deployment failed. Cleaning up resource group..."
          az group delete --name ${{ steps.env.outputs.rg_name }} --yes --no-wait || true
          echo "Check logs above for error details"

      - name: Azure Logout
        if: always()
        run: az logout
