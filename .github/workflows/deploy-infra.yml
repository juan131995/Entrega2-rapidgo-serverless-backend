name: Deploy Infrastructure

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/infra-arm/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:
    inputs:
      environmentName:
        description: 'Environment (dev/prod)'
        required: true
        default: 'dev'
      location:
        description: 'Azure region'
        required: true
        default: 'centralus'

env:
  ARM_TEMPLATE: src/infra-arm/main.json
  PARAMS_FILE: src/infra-arm/azuredeploy.parameters.json

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set environment variables
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV_NAME="${{ github.event.inputs.environmentName }}"
            LOCATION="${{ github.event.inputs.location }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENV_NAME="prod"
            LOCATION="centralus"
          else
            ENV_NAME="dev"
            LOCATION="centralus"
          fi

          # Generate GUARANTEED unique suffix using timestamp + random
          # Format: YYMMDD-HHMM + 4 random chars = 13 chars total
          # This ensures ZERO collisions across ALL deployments (past, present, future)
          TIMESTAMP=$(date +%y%m%d%H%M)
          RANDOM_PART=$(openssl rand -hex 2 | tr '[:upper:]' '[:lower:]')
          RANDOM_SUFFIX="${TIMESTAMP}${RANDOM_PART}"

          # Use simple RG name (resources will be unique via randomSuffix)
          RG_NAME="rg-rapidgo-${ENV_NAME}-${RANDOM_SUFFIX}"

          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "location=$LOCATION" >> $GITHUB_OUTPUT
          echo "rg_name=$RG_NAME" >> $GITHUB_OUTPUT
          echo "random_suffix=$RANDOM_SUFFIX" >> $GITHUB_OUTPUT

          echo "Environment: $ENV_NAME"
          echo "Location: $LOCATION"
          echo "Resource Group: $RG_NAME"
          echo "Random Suffix: $RANDOM_SUFFIX"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Purge Soft-Deleted Resources
        run: |
          echo "🧹 Cleaning up soft-deleted resources that can cause deployment conflicts..."
          echo ""

          # ============================================================
          # 1. PURGE API MANAGEMENT
          # ============================================================
          echo "🔍 1. API Management - Checking for soft-deleted services..."
          DELETED_APIMS=$(az rest \
            --method get \
            --url "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/providers/Microsoft.ApiManagement/deletedservices?api-version=2023-05-01-preview" \
            --query "value[].{name:name, location:location}" \
            -o json 2>/dev/null || echo "[]")

          APIM_COUNT=$(echo "$DELETED_APIMS" | jq '. | length')
          echo "Found $APIM_COUNT soft-deleted APIM service(s)"

          if [ "$APIM_COUNT" -gt 0 ]; then
            echo "$DELETED_APIMS" | jq -c '.[]' | while read -r apim; do
              APIM_NAME=$(echo "$apim" | jq -r '.name')
              APIM_LOCATION=$(echo "$apim" | jq -r '.location')

              if [ "$APIM_NAME" != "null" ] && [ "$APIM_LOCATION" != "null" ]; then
                echo "  🗑️  Purging APIM: $APIM_NAME in $APIM_LOCATION"
                az rest \
                  --method delete \
                  --url "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/providers/Microsoft.ApiManagement/locations/${APIM_LOCATION}/deletedservices/${APIM_NAME}?api-version=2023-05-01-preview" \
                  || echo "  ⚠️  Failed to purge $APIM_NAME"
                echo "  ✅ Purged: $APIM_NAME"
              fi
            done
          fi

          echo ""

          # ============================================================
          # 2. PURGE KEY VAULTS
          # ============================================================
          echo "🔍 2. Key Vault - Checking for soft-deleted vaults..."
          DELETED_KVS=$(az keyvault list-deleted \
            --query "[].{name:name, location:properties.location}" \
            -o json 2>/dev/null || echo "[]")

          KV_COUNT=$(echo "$DELETED_KVS" | jq '. | length')
          echo "Found $KV_COUNT soft-deleted Key Vault(s)"

          if [ "$KV_COUNT" -gt 0 ]; then
            echo "$DELETED_KVS" | jq -c '.[]' | while read -r kv; do
              KV_NAME=$(echo "$kv" | jq -r '.name')
              KV_LOCATION=$(echo "$kv" | jq -r '.location')

              if [ "$KV_NAME" != "null" ] && [ "$KV_LOCATION" != "null" ]; then
                echo "  🗑️  Purging Key Vault: $KV_NAME in $KV_LOCATION"
                az keyvault purge --name "$KV_NAME" --location "$KV_LOCATION" \
                  || echo "  ⚠️  Failed to purge $KV_NAME"
                echo "  ✅ Purged: $KV_NAME"
              fi
            done
          fi

          echo ""

          # ============================================================
          # 3. CLEANUP ORPHANED NOTIFICATION HUBS
          # ============================================================
          echo "🔍 3. Notification Hubs - Checking for orphaned namespaces..."
          DELETED_NH=$(az resource list \
            --resource-type "Microsoft.NotificationHubs/namespaces" \
            --query "[?starts_with(name, 'rg-') && (provisioningState=='Deleting' || provisioningState=='Failed')].{name:name, resourceGroup:resourceGroup}" \
            -o json 2>/dev/null || echo "[]")

          NH_COUNT=$(echo "$DELETED_NH" | jq '. | length')
          echo "Found $NH_COUNT problematic Notification Hub namespace(s)"

          if [ "$NH_COUNT" -gt 0 ]; then
            echo "$DELETED_NH" | jq -c '.[]' | while read -r nh; do
              NH_NAME=$(echo "$nh" | jq -r '.name')
              NH_RG=$(echo "$nh" | jq -r '.resourceGroup')

              if [ "$NH_NAME" != "null" ] && [ "$NH_RG" != "null" ]; then
                echo "  🗑️  Deleting Notification Hub: $NH_NAME"
                az resource delete \
                  --resource-group "$NH_RG" \
                  --name "$NH_NAME" \
                  --resource-type "Microsoft.NotificationHubs/namespaces" \
                  || echo "  ⚠️  Failed to delete $NH_NAME"
                echo "  ✅ Deleted: $NH_NAME"
              fi
            done
          fi

          echo ""
          echo "✅ Soft-delete cleanup completed"

      - name: Cleanup Old Resource Groups
        run: |
          echo "🧹 Checking for existing resource groups to clean up..."

          # Get list of old resource groups for this environment
          OLD_RGS=$(az group list \
            --query "[?starts_with(name, 'rg-rapidgo-${{ steps.env.outputs.env_name }}-')].name" \
            -o tsv)

          if [ -n "$OLD_RGS" ]; then
            echo "Found existing resource groups:"
            echo "$OLD_RGS"
            echo ""
            echo "🗑️  Deleting old resource groups (this may take a few minutes)..."

            for RG in $OLD_RGS; do
              echo "  Deleting: $RG"
              az group delete --name "$RG" --yes --no-wait
            done

            echo "✅ Initiated deletion of old resource groups"
            echo "⏳ Waiting 60 seconds for deletions to start..."
            sleep 60
          else
            echo "No existing resource groups found - this is a fresh deployment"
          fi

      - name: Create Resource Group
        run: |
          az group create \
            --name ${{ steps.env.outputs.rg_name }} \
            --location ${{ steps.env.outputs.location }} \
            --tags environment=${{ steps.env.outputs.env_name }} managedBy=github-actions

      - name: Deploy ARM Template
        id: deploy
        timeout-minutes: 90
        run: |
          DEPLOYMENT_NAME="rapidgo-${{ steps.env.outputs.env_name }}-$(date +%Y%m%d-%H%M%S)"

          echo "⏳ Starting deployment: $DEPLOYMENT_NAME"
          echo "⚠️  API Management can take 30-50 minutes to deploy"
          echo "📊 Progress will be logged every 5 minutes"

          az deployment group create \
            --resource-group ${{ steps.env.outputs.rg_name }} \
            --name "$DEPLOYMENT_NAME" \
            --template-file $ARM_TEMPLATE \
            --parameters @$PARAMS_FILE \
            --parameters environmentName=${{ steps.env.outputs.env_name }} \
            --parameters randomSuffix=${{ steps.env.outputs.random_suffix }} \
            --mode Incremental \
            --no-wait

          # Monitor deployment progress
          echo "Monitoring deployment progress..."
          TIMEOUT=5400  # 90 minutes in seconds
          ELAPSED=0
          INTERVAL=300  # Check every 5 minutes

          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATE=$(az deployment group show \
              --resource-group ${{ steps.env.outputs.rg_name }} \
              --name "$DEPLOYMENT_NAME" \
              --query properties.provisioningState -o tsv 2>/dev/null || echo "NotFound")

            echo "[$((ELAPSED/60))m] Deployment state: $STATE"

            if [ "$STATE" = "Succeeded" ]; then
              echo "✅ Deployment completed successfully!"
              exit 0
            elif [ "$STATE" = "Failed" ] || [ "$STATE" = "Canceled" ]; then
              echo "❌ Deployment failed with state: $STATE"
              az deployment group show \
                --resource-group ${{ steps.env.outputs.rg_name }} \
                --name "$DEPLOYMENT_NAME" \
                --query properties.error -o json
              exit 1
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "⏱️ Deployment timed out after 90 minutes"
          exit 1

      - name: Get Deployment Outputs
        if: success()
        run: |
          OUTPUTS=$(az deployment group show \
            --resource-group ${{ steps.env.outputs.rg_name }} \
            --name $(az deployment group list -g ${{ steps.env.outputs.rg_name }} --query "[0].name" -o tsv) \
            --query properties.outputs -o json)

          echo "Deployment Outputs:"
          echo "$OUTPUTS" | jq .

      - name: Deployment Summary
        if: success()
        run: |
          {
            echo "## ✅ Deployment Successful"
            echo ""
            echo "- **Environment:** ${{ steps.env.outputs.env_name }}"
            echo "- **Resource Group:** \`${{ steps.env.outputs.rg_name }}\`"
            echo "- **Location:** ${{ steps.env.outputs.location }}"
            echo "- **Random Suffix:** \`${{ steps.env.outputs.random_suffix }}\`"
            echo ""
            echo "### Resource Names"
            echo "All resources use the suffix \`${{ steps.env.outputs.random_suffix }}\` to ensure uniqueness."
            echo ""
            echo "### Next Steps"
            echo "1. Verify resources in Azure Portal"
            echo "2. Deploy function code"
            echo "3. Test API endpoints"
            echo ""
            echo "### Cleanup"
            echo "To delete old deployments, use: \`./scripts/cleanup-all-resources.sh ${{ steps.env.outputs.env_name }}\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: Cleanup on Failure
        if: failure()
        run: |
          echo "⚠️ Deployment failed. Cleaning up resource group..."
          az group delete --name ${{ steps.env.outputs.rg_name }} --yes --no-wait || true
          echo "Check logs above for error details"

      - name: Azure Logout
        if: always()
        run: az logout
