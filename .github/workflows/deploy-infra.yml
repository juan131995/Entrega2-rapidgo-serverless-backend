name: Deploy Infrastructure - ARM Templates

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/infra-arm/**'
  workflow_dispatch:
    inputs:
      environmentName:
        description: 'Environment name (dev, nonprod, prod)'
        required: true
        default: 'dev'
      location:
        description: 'Azure region'
        required: true
        default: 'brazilsouth'
      confirm:
        description: 'Type "yes" to confirm deployment'
        required: true
        default: 'no'

jobs:
  create-rg:
    name: Create Resource Group
    runs-on: ubuntu-latest
    outputs:
      rg_name: ${{ steps.env.outputs.rg_name }}
      env_name: ${{ steps.env.outputs.env_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            NAME="${{ github.event.inputs.environmentName }}"
          elif [ "${{ github.ref }}" == "refs/heads/develop" ] || [ "${{ github.ref }}" == "refs/heads/main" ]; then
            NAME="dev"
          else
            NAME="dev"
          fi
          echo "env_name=$NAME" >> $GITHUB_OUTPUT
          echo "rg_name=az-rapidgo-${NAME}-rg" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group via ARM
        uses: azure/arm-deploy@v2
        with:
          scope: 'subscription'
          region: 'brazilsouth'
          template: src/infra-arm/resource-group/deploy.json
          parameters: >
            resourceGroupName=${{ steps.env.outputs.rg_name }}
            location=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'brazilsouth' }}
            environmentName=${{ steps.env.outputs.env_name }}
          deploymentMode: Incremental
          deploymentName: rg-az-rapidgo-${{ steps.env.outputs.env_name }}

  validate:
    name: Validate ARM Templates
    runs-on: ubuntu-latest
    needs: [create-rg]
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate main.json
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ needs.create-rg.outputs.rg_name }}
          template: src/infra-arm/main.json
          parameters: src/infra-arm/azuredeploy.parameters.json
          deploymentMode: Validate

  deploy:
    name: Deploy Infrastructure to Azure
    runs-on: ubuntu-latest
    needs: [validate, create-rg]
    if: >
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'yes')

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy ARM Template
        id: deploy
        uses: azure/arm-deploy@v2
        timeout-minutes: 30
        with:
          resourceGroupName: ${{ needs.create-rg.outputs.rg_name }}
          template: src/infra-arm/main.json
          deploymentName: arm-rapidgo-${{ needs.create-rg.outputs.env_name }}
          parameters: >
            environmentName=${{ needs.create-rg.outputs.env_name }}
            location=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.location || 'brazilsouth' }}
            functionAppRuntime=node
            cosmosDBFreeTier=true
            skuAPIM=Developer
          deploymentMode: Incremental

      - name: Configure FCM v1 on Notification Hub
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            SA_JSON='${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
            CLIENT_EMAIL=$(echo "$SA_JSON" | jq -r '.client_email')
            PRIVATE_KEY=$(echo "$SA_JSON" | jq -r '.private_key')
            PROJECT_ID=$(echo "$SA_JSON" | jq -r '.project_id')

            SUBSCRIPTION_ID=$(az account show --query id -o tsv)
            RG="${{ needs.create-rg.outputs.rg_name }}"
            NS="az-rapidgo-${{ needs.create-rg.outputs.env_name }}-notif-ns"
            HUB="az-rapidgo-${{ needs.create-rg.outputs.env_name }}-notifications"

            az rest --method put \
              --url "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG}/providers/Microsoft.NotificationHubs/namespaces/${NS}/notificationHubs/${HUB}/pnsCredentials?api-version=2023-01-01-preview" \
              --headers "Content-Type=application/json" \
              --body "{
                \"properties\": {
                  \"fcmV1Credential\": {
                    \"properties\": {
                      \"clientEmail\": \"${CLIENT_EMAIL}\",
                      \"privateKey\": \"${PRIVATE_KEY}\",
                      \"projectId\": \"${PROJECT_ID}\"
                    }
                  }
                }
              }" && { echo "FCM v1 configurado correctamente"; break; } || {
              echo "Intento $i fallo, reintentando..." >&2
              sleep 5
            }
          done

      - name: Rollback on failure
        if: failure()
        run: |
          RG="${{ needs.create-rg.outputs.rg_name }}"
          echo "## Fallo en el despliegue de infraestructura" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Causas posibles" >> $GITHUB_STEP_SUMMARY
          echo "- Cuota de suscripcion insuficiente (Cosmos DB free tier ya usado)" >> $GITHUB_STEP_SUMMARY
          echo "- Nombre de recurso duplicado (Key Vault, Storage Account son globales)" >> $GITHUB_STEP_SUMMARY
          echo "- Error de permisos del Service Principal" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Limpieza manual (si es necesario)" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "az group delete --name $RG --yes --no-wait" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> El deployment ARM usa modo Incremental: los recursos creados antes del fallo" >> $GITHUB_STEP_SUMMARY
          echo "> fueron revertidos automaticamente por Azure. Solo es necesario eliminar el RG" >> $GITHUB_STEP_SUMMARY
          echo "> si quieres limpiar por completo." >> $GITHUB_STEP_SUMMARY

      - name: Deployment Summary
        if: success()
        run: |
          {
            echo "## Infraestructura Desplegada"
            echo "- Entorno: **${{ needs.create-rg.outputs.env_name }}**"
            echo "- Grupo de recursos: **${{ needs.create-rg.outputs.rg_name }}**"
            echo "- Function App: \`${{ steps.deploy.outputs.functionAppDefaultHostName }}\`"
            echo "- API Management: \`${{ steps.deploy.outputs.apimGatewayUrl }}\`"
            echo "- Cosmos DB: \`${{ steps.deploy.outputs.cosmosDbEndpoint }}\`"
            echo "- Blob Storage: \`${{ steps.deploy.outputs.blobStorageEndpoint }}\`"
            echo "- Notification Hubs: \`${{ steps.deploy.outputs.notificationHubEndpoint }}\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: Azure Logout
        if: always()
        run: az logout
