name: Deploy Azure Functions

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/rapidgo-functions/**'
      - '!src/rapidgo-functions/local.settings.json'
  workflow_dispatch:
    inputs:
      environmentName:
        description: 'Environment name (dev, nonprod, prod)'
        required: true
        default: 'dev'

jobs:
  build-and-deploy:
    name: Build & Deploy Functions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set environment name
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.environmentName }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "name=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "name=dev" >> $GITHUB_OUTPUT
          else
            echo "name=dev" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: src/rapidgo-functions/package.json

      - name: Install dependencies
        run: npm ci --production
        working-directory: src/rapidgo-functions

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Function App name
        id: get-app-name
        run: |
          RG="az-rapidgo-${{ steps.env.outputs.name }}-rg"
          APP_NAME=$(az functionapp list --resource-group "$RG" --query "[0].name" -o tsv)
          if [ -z "$APP_NAME" ]; then
            echo "::error::No Function App found in resource group $RG. Run deploy-infra workflow first."
            exit 1
          fi
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "Found Function App: $APP_NAME"

      - name: Capture pre-deployment state
        id: pre-deploy
        continue-on-error: true
        run: |
          APP="${{ steps.get-app-name.outputs.app_name }}"
          RG="az-rapidgo-${{ steps.env.outputs.name }}-rg"

          # Capturar deployment slot activo
          ACTIVE_SLOT=$(az functionapp show --name "$APP" --resource-group "$RG" --query "state" -o tsv)
          echo "active_slot=$ACTIVE_SLOT" >> $GITHUB_OUTPUT

          # Capturar últimas 5 deployments para rollback
          DEPLOYMENTS=$(az webapp deployment list --name "$APP" --resource-group "$RG" --query "[0:5].id" -o tsv 2>/dev/null || echo "")
          echo "Available deployments for potential rollback:"
          echo "$DEPLOYMENTS"

          # Guardar la versión actual del runtime
          CURRENT_VERSION=$(az functionapp config show --name "$APP" --resource-group "$RG" --query "linuxFxVersion" -o tsv 2>/dev/null || echo "unknown")
          echo "current_runtime_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current runtime: $CURRENT_VERSION"

          # Verificar que la app está running
          APP_STATE=$(az functionapp show --name "$APP" --resource-group "$RG" --query "state" -o tsv)
          echo "app_state_before=$APP_STATE" >> $GITHUB_OUTPUT
          echo "App state before deployment: $APP_STATE"

      - name: Deploy Functions to Azure
        id: fa
        uses: Azure/functions-action@v1
        timeout-minutes: 10
        with:
          app-name: ${{ steps.get-app-name.outputs.app_name }}
          package: src/rapidgo-functions
          respect-pom-xml: false
          respect-funcignore: true

      - name: Rollback on failure
        if: failure() && steps.fa.conclusion == 'failure'
        run: |
          APP="${{ steps.get-app-name.outputs.app_name }}"
          RG="az-rapidgo-${{ steps.env.outputs.name }}-rg"

          echo "## 🔴 Function Deployment Failed - Verificando Estado" | tee -a $GITHUB_STEP_SUMMARY
          echo "" | tee -a $GITHUB_STEP_SUMMARY

          # Verificar estado actual de la Function App
          CURRENT_STATE=$(az functionapp show --name "$APP" --resource-group "$RG" --query "state" -o tsv 2>/dev/null || echo "unknown")
          PREVIOUS_STATE="${{ steps.pre-deploy.outputs.app_state_before }}"

          echo "### Estado de la Function App" | tee -a $GITHUB_STEP_SUMMARY
          echo "- Estado previo al deployment: **$PREVIOUS_STATE**" | tee -a $GITHUB_STEP_SUMMARY
          echo "- Estado actual: **$CURRENT_STATE**" | tee -a $GITHUB_STEP_SUMMARY
          echo "" | tee -a $GITHUB_STEP_SUMMARY

          # Verificar si el deployment dejó la app en mal estado
          if [ "$CURRENT_STATE" != "Running" ] && [ "$PREVIOUS_STATE" == "Running" ]; then
            echo "⚠️ La Function App dejó de funcionar - intentando restaurar" | tee -a $GITHUB_STEP_SUMMARY

            # Intentar reiniciar la Function App
            echo "Reiniciando Function App..." | tee -a $GITHUB_STEP_SUMMARY
            az functionapp restart --name "$APP" --resource-group "$RG"

            # Esperar y verificar
            sleep 30
            NEW_STATE=$(az functionapp show --name "$APP" --resource-group "$RG" --query "state" -o tsv)
            echo "Estado después del reinicio: **$NEW_STATE**" | tee -a $GITHUB_STEP_SUMMARY

            if [ "$NEW_STATE" == "Running" ]; then
              echo "✓ Function App restaurada exitosamente" | tee -a $GITHUB_STEP_SUMMARY
            else
              echo "❌ No se pudo restaurar automáticamente - se requiere intervención manual" | tee -a $GITHUB_STEP_SUMMARY
            fi
          else
            echo "✓ La Function App está en estado Running" | tee -a $GITHUB_STEP_SUMMARY
            echo "✓ El deployment atómico previno corrupción del código" | tee -a $GITHUB_STEP_SUMMARY
          fi

          echo "" | tee -a $GITHUB_STEP_SUMMARY
          echo "### Posibles Causas del Fallo" | tee -a $GITHUB_STEP_SUMMARY
          echo "- Error de compilación o dependencias faltantes en package.json" | tee -a $GITHUB_STEP_SUMMARY
          echo "- Timeout durante el zip deployment" | tee -a $GITHUB_STEP_SUMMARY
          echo "- Problema de permisos del Service Principal" | tee -a $GITHUB_STEP_SUMMARY
          echo "- Configuración incorrecta en app settings" | tee -a $GITHUB_STEP_SUMMARY
          echo "" | tee -a $GITHUB_STEP_SUMMARY

          echo "### Verificación Manual Recomendada" | tee -a $GITHUB_STEP_SUMMARY
          echo '```bash' | tee -a $GITHUB_STEP_SUMMARY
          echo "# Verificar estado" | tee -a $GITHUB_STEP_SUMMARY
          echo "az functionapp show --name $APP --resource-group $RG --query 'state' -o tsv" | tee -a $GITHUB_STEP_SUMMARY
          echo "" | tee -a $GITHUB_STEP_SUMMARY
          echo "# Ver logs de deployment" | tee -a $GITHUB_STEP_SUMMARY
          echo "az webapp log deployment show --name $APP --resource-group $RG" | tee -a $GITHUB_STEP_SUMMARY
          echo "" | tee -a $GITHUB_STEP_SUMMARY
          echo "# Ver logs en tiempo real" | tee -a $GITHUB_STEP_SUMMARY
          echo "az webapp log tail --name $APP --resource-group $RG" | tee -a $GITHUB_STEP_SUMMARY
          echo '```' | tee -a $GITHUB_STEP_SUMMARY

          exit 1

      - name: Deployment Summary
        if: success()
        run: |
          echo "## Functions Desplegadas" >> $GITHUB_STEP_SUMMARY
          echo "- Entorno: ${{ steps.env.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Function App: ${{ steps.get-app-name.outputs.app_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Funciones: registrarPedido, actualizarEstado, consultarHistorial, notificarCliente" >> $GITHUB_STEP_SUMMARY
          echo "- Secretos: Azure Key Vault (cosmos-db, notification-hub, blob-storage)" >> $GITHUB_STEP_SUMMARY

      - name: Azure Logout
        if: always()
        run: az logout
