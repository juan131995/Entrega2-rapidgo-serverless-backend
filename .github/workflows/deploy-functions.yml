name: Deploy Azure Functions

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/rapidgo-functions/**'
      - '!src/rapidgo-functions/local.settings.json'
  workflow_dispatch:
    inputs:
      environmentName:
        description: 'Environment name (dev, nonprod, prod)'
        required: true
        default: 'dev'

jobs:
  build-and-deploy:
    name: Build & Deploy Functions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set environment name
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.environmentName }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "name=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "name=dev" >> $GITHUB_OUTPUT
          else
            echo "name=dev" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: src/rapidgo-functions/package.json

      - name: Install dependencies
        run: npm ci --production
        working-directory: src/rapidgo-functions

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Functions to Azure
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: az-rapidgo-${{ steps.env.outputs.name }}-functions
          package: src/rapidgo-functions
          respect-pom-xml: false
          respect-funcignore: true

      - name: Deployment Summary
        run: |
          echo "## Functions Desplegadas" >> $GITHUB_STEP_SUMMARY
          echo "- Entorno: ${{ steps.env.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Function App: az-rapidgo-${{ steps.env.outputs.name }}-functions" >> $GITHUB_STEP_SUMMARY
          echo "- Funciones: registrarPedido, actualizarEstado, consultarHistorial, notificarCliente" >> $GITHUB_STEP_SUMMARY
          echo "- Secretos: Azure Key Vault (cosmos-db, notification-hub, blob-storage, fcm-api-key)" >> $GITHUB_STEP_SUMMARY

      - name: Azure Logout
        run: az logout
