name: Deploy Blob Storage

on:
  workflow_call:
    inputs:
      rg_name:
        required: true
        type: string
      location:
        required: true
        type: string
      env_name:
        required: true
        type: string
      suffix:
        required: true
        type: string
    secrets:
      AZURE_CREDENTIALS:
        required: true
    outputs:
      blob_account_name:
        description: "Blob Storage account name"
        value: ${{ jobs.deploy.outputs.blob_account_name }}
      blob_container_name:
        description: "Blob container name"
        value: ${{ jobs.deploy.outputs.blob_container_name }}
      blob_endpoint:
        description: "Blob storage endpoint"
        value: ${{ jobs.deploy.outputs.blob_endpoint }}

jobs:
  deploy:
    name: Deploy Blob Storage
    runs-on: ubuntu-latest
    outputs:
      blob_account_name: ${{ steps.outputs.outputs.blobAccountName }}
      blob_container_name: ${{ steps.outputs.outputs.blobContainerName }}
      blob_endpoint: ${{ steps.outputs.outputs.blobEndpoint }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Blob Storage ARM template
        id: deploy
        run: |
          az deployment group create \
            --resource-group "${{ inputs.rg_name }}" \
            --name "storage-${{ github.run_number }}-${{ github.run_attempt }}" \
            --template-file src/infra-arm/storage/template.json \
            --parameters environmentName="${{ inputs.env_name }}" suffix="${{ inputs.suffix }}" \
            --mode Incremental

      - name: Capture outputs
        id: outputs
        run: |
          RESULT=$(az deployment group show \
            --resource-group "${{ inputs.rg_name }}" \
            --name "storage-${{ github.run_number }}-${{ github.run_attempt }}" \
            --query properties.outputs -o json)

          echo "blobAccountName=$(echo "$RESULT" | jq -r '.blobStorageAccountName.value')" >> $GITHUB_OUTPUT
          echo "blobContainerName=$(echo "$RESULT" | jq -r '.blobContainerName.value')" >> $GITHUB_OUTPUT
          echo "blobEndpoint=$(echo "$RESULT" | jq -r '.blobEndpoint.value')" >> $GITHUB_OUTPUT

          echo "### ✅ Blob Storage" >> $GITHUB_STEP_SUMMARY
          echo "- Account: $(echo "$RESULT" | jq -r '.blobStorageAccountName.value')" >> $GITHUB_STEP_SUMMARY
          echo "- Container: $(echo "$RESULT" | jq -r '.blobContainerName.value')" >> $GITHUB_STEP_SUMMARY

      - name: Azure Logout
        if: always()
        run: az logout
